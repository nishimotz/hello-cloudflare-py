[project]
name = "hello-cloudflare-py"
version = "0.1.0"
description = "Cloudflare Workers を Python で書くための日本語ハンズオン"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "workers-py>=1.0",
    "ruff>=0.9",
]

# このリポジトリは Python パッケージとして配らない（教材 + Worker 集）。
# hatchling が wheel 化対象を決められないため、wheel ビルドに明示的な空指定を与える。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
# ルートには Python パッケージを置かない（Worker は runtime が実行する）。
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
# Worker 本体は `workers` SDK（pywrangler が提供）を使うため、
# このリポジトリの lint 対象からは除外する。
extend-exclude = ["exercises/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
